<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Hố Đen 3D</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" id="ati" href="icon.svg">
<link rel="manifest" href="manifest.json">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;position:fixed;inset:0;width:100%;height:100%;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;background:#120a26;color:#fff;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden;touch-action:none}
:root{--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
.scr{position:fixed;inset:0;display:none}
.scr.on{display:block}
#menu{background:radial-gradient(ellipse at 50% 0,#3b1d7a 0,#120a26 70%)}
#top{position:absolute;left:0;right:0;top:0;z-index:5;padding:calc(var(--st) + 10px) calc(var(--sr) + 14px) 10px calc(var(--sl) + 14px);display:flex;align-items:center;gap:8px;background:linear-gradient(#120a26 68%,transparent)}
#top img{width:42px;height:42px;border-radius:12px;flex:none}
#top h1{margin:0;font-size:19px;line-height:1.15;flex:1;min-width:0;letter-spacing:.3px}
#top small{display:block;font-weight:400;font-size:11.5px;opacity:.78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:42px;height:42px;border-radius:50%;border:2px solid #9b73ff;background:radial-gradient(circle at 35% 28%,#4a2a8f,#241247 70%);box-shadow:0 3px 10px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.25);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;flex:none}
.ib.off{opacity:.45;border-color:#555}
.skb{width:auto;border-radius:22px;padding:0 11px 0 6px;gap:5px;border-color:#ffb74d;background:linear-gradient(135deg,#5b289e,#2c1454);font-size:13px;font-weight:700}
.skb canvas{position:static;width:30px;height:30px;border-radius:50%;flex:none}
#map{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;padding-top:calc(var(--st) + 70px)}
#road{position:relative;width:100%;max-width:520px;margin:0 auto}
#road svg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;width:var(--ns,58px);height:var(--ns,58px);margin:calc(var(--ns,58px)/-2) 0 0 calc(var(--ns,58px)/-2);border-radius:50%;border:3px solid #4b3a78;background:#241247;color:#8d7fb5;font-weight:700;font-size:calc(var(--ns,58px)*.31);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.35)}
.node.done{background:#2e9b6a;border-color:#7dffc0;color:#fff}
.node.cur{background:#8a5cff;border-color:#fff;color:#fff}
.node.cur::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:3px solid #8a5cff;pointer-events:none;animation:pl 1.4s ease-out infinite}
.node.lock{cursor:default}
@keyframes pl{from{transform:scale(1);opacity:.7}to{transform:scale(1.55);opacity:0}}
.ban{position:absolute;left:50%;transform:translateX(-50%);padding:4px 12px;border-radius:14px;background:#241247dd;font-size:13px;border:1px solid #8a5cff;white-space:nowrap;pointer-events:none}
#game{background:#000}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;left:0;right:0;top:0;padding:calc(var(--st) + 8px) calc(var(--sr) + 10px) 0 calc(var(--sl) + 10px);display:flex;align-items:center;gap:7px;pointer-events:none;z-index:6}
#hud .ib{pointer-events:auto;width:40px;height:40px;font-size:16px}
#hb{display:contents}
#pz{position:absolute;inset:0;z-index:5;background:rgba(10,5,25,.64);backdrop-filter:blur(4px);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#pz.on{display:flex}#pz h2{margin:0;font-size:30px;letter-spacing:1px}#pz .btn{min-width:220px}
#rg{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 20px);z-index:6;display:none;box-shadow:0 4px 18px rgba(0,0,0,.55);white-space:nowrap}
@media (orientation:portrait) and (max-width:560px){#hud{flex-wrap:wrap;row-gap:6px}#hb{display:flex;flex:1 1 100%;justify-content:flex-end;gap:7px;order:5}}
#lv{font-weight:700;font-size:15px;min-width:54px;text-shadow:0 2px 6px rgba(0,0,0,.8)}
#bar{flex:1;height:14px;border-radius:7px;background:rgba(0,0,0,.5);border:2px solid #fff4;overflow:hidden}
#fill{height:100%;width:0;background:linear-gradient(90deg,#8a5cff,#ff8ad8);box-shadow:0 0 10px rgba(255,138,216,.6)}
#hint{position:absolute;left:12px;right:12px;bottom:18%;text-align:center;font-size:15px;font-weight:600;opacity:.92;pointer-events:none;text-shadow:0 2px 8px #000,0 0 2px #000;transition:opacity .6s}
#win{position:absolute;inset:0;background:rgba(10,5,25,.82);display:none;text-align:center;padding:calc(var(--st) + 12px) calc(var(--sr) + 16px) calc(var(--sb) + 12px) calc(var(--sl) + 16px);overflow:auto;touch-action:pan-y;z-index:20}
#wc{margin:auto;display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:440px;position:relative;z-index:1}
#wt0{display:flex;flex-direction:column;align-items:center;gap:8px}#wb{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
#game.res #hud,#game.res #hint{visibility:hidden}
#win.on{display:flex}
#win.on #cf{z-index:0}
#win h2{font-size:30px;margin:0}
.btn{min-width:200px;padding:13px 22px;border-radius:26px;border:0;background:linear-gradient(180deg,#9d74ff,#7442f5);box-shadow:0 4px 14px rgba(116,66,245,.45),inset 0 1px 0 rgba(255,255,255,.3);color:#fff;font-size:17px;font-weight:700;cursor:pointer;font-family:inherit}
.btn.alt{background:linear-gradient(180deg,#39236e,#25154a);box-shadow:0 3px 10px rgba(0,0,0,.35)}
#win.w{background:radial-gradient(ellipse at 50% 30%,rgba(120,70,220,.93),rgba(10,5,25,.93) 75%)}
#win.l{background:rgba(44,44,50,.95)}
#wi{font-size:84px;line-height:1}
#ws{font-size:32px;letter-spacing:6px;min-height:0}
#win.w #wi{animation:bn .9s ease-in-out infinite alternate;filter:drop-shadow(0 0 18px #ffd166)}
@keyframes bn{from{transform:translateY(0) scale(1)}to{transform:translateY(-12px) scale(1.12)}}
#win.l #wi{filter:grayscale(1);animation:sd 2.2s ease-in-out infinite alternate}
@keyframes sd{from{transform:translateY(0)}to{transform:translateY(8px)}}
#win.w h2{color:#ffe27a;text-shadow:0 0 18px rgba(255,210,90,.6)}
#win.l h2{color:#c9c9d1}#win.l #wd{color:#aaa}
#win.l .btn{background:#6a6a72;box-shadow:none}#win.l .btn.alt{background:#45454c;box-shadow:none}
#cf{position:fixed;inset:0;overflow:hidden;pointer-events:none}
#cf i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:cfl linear forwards}
@keyframes cfl{to{transform:translateY(110vh) rotate(720deg)}}
#set,#skm{position:fixed;inset:0;z-index:30;background:rgba(10,5,25,.9);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:calc(var(--st) + 12px) calc(var(--sr) + 16px) calc(var(--sb) + 12px) calc(var(--sl) + 16px)}
#set.on,#skm.on{display:flex}
#set .box,#skm .box{width:100%;max-width:440px;margin:auto;max-height:100%;overflow-y:auto;touch-action:pan-y;overscroll-behavior:contain;padding:2px}
#sx,#skx{position:sticky;bottom:0;box-shadow:0 0 0 8px rgba(10,5,25,.95);width:100%;max-width:none}
#set h2,#skm h2{margin:0 0 4px;font-size:23px;text-align:center}
#set .sub,#skm .sub{opacity:.8;font-size:12.5px;text-align:center;margin-bottom:10px}
#skst{display:block;text-align:center;font-size:12.5px;font-weight:700;padding:7px 12px;border-radius:12px;background:rgba(138,92,255,.2);border:1px solid rgba(155,115,255,.5);color:#ffe27a;margin-bottom:10px}
.go{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:16px;border:2px solid #4b3a78;background:#241247;color:#fff;margin-bottom:10px;cursor:pointer;font-family:inherit}
.go b{display:block;font-size:17px;margin-bottom:3px}
.go span{font-size:13px;opacity:.75;line-height:1.35;display:block}
.go.on{border-color:#8a5cff;background:#3b1d7a;box-shadow:0 0 0 3px rgba(138,92,255,.3)}
@media (orientation:landscape){
#set .box{max-width:780px}#set h2{margin-bottom:10px}
#gl{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
#gl .go{margin:0;height:100%;display:flex;flex-direction:column;justify-content:flex-start}
#sx{max-width:320px;margin:0 auto}}
#sg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.sc{position:relative;border:2px solid #4b3a78;background:linear-gradient(180deg,#2e1859,#1c0e38);border-radius:14px;padding:5px 3px 6px;text-align:center;color:#fff;font:inherit;font-size:11px;font-weight:600;cursor:pointer;min-width:0;transition:transform .12s,border-color .15s}
.sc:active{transform:scale(.95)}
.sc canvas{position:static;width:100%;height:auto;aspect-ratio:1;display:block;margin:0 auto 2px}
.sc .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.sc .tg{position:absolute;top:4px;left:5px;font-size:9px;opacity:.6;font-weight:700}
.sc.on{border-color:#ffd166;background:linear-gradient(180deg,#4c2694,#2b1457);box-shadow:0 0 0 2px rgba(255,209,102,.35)}
.sc.on::after{content:"✓";position:absolute;top:3px;right:4px;width:16px;height:16px;border-radius:50%;background:#ffd166;color:#1a0b36;font-size:10px;font-weight:900;line-height:16px;text-align:center}
.sc.rnd{grid-column:1/-1;padding:10px 12px;font-size:13.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
@media (max-width:430px){#top{gap:6px}#top .ib{width:38px;height:38px}#top .skb{width:auto;padding:0 9px 0 5px;font-size:12px}#top .skb canvas{width:26px;height:26px}}
@media (orientation:landscape){#skm .box{max-width:780px}#sg{grid-template-columns:repeat(6,1fr)}#skx{max-width:320px;margin:0 auto}}
@media (orientation:landscape) and (max-height:520px){#skm .sub{display:none}#skm h2{font-size:18px;margin-bottom:6px}#skst{padding:4px 10px;font-size:11.5px;margin-bottom:6px}#sg{grid-template-columns:repeat(10,1fr);gap:6px}.sc{font-size:9px;padding:2px 1px 3px}.sc.rnd{padding:6px;font-size:12px}}
@media (orientation:landscape){
#wc{max-width:720px;flex-direction:row;gap:22px;align-items:center}
#wt0{flex:1 1 50%;min-width:0}#wb{flex:1 1 50%;min-width:0}
#wi{font-size:64px}#win h2{font-size:24px}#ws{font-size:22px}
.btn{min-width:0;width:100%;max-width:280px;padding:11px 18px;font-size:16px}}
@media (orientation:landscape) and (max-height:520px){
#top{padding-top:calc(var(--st) + 6px);padding-bottom:6px}#top img{width:34px;height:34px}#top h1{font-size:17px}
#map{padding-top:calc(var(--st) + 56px)}
#wi{font-size:50px}#win h2{font-size:21px}.btn{padding:9px 16px;font-size:15px}
#set .sub{display:none}#set h2{font-size:19px;margin-bottom:8px}#set .box{max-width:780px}#gl{gap:8px;margin-bottom:8px}.go{padding:8px 12px}.go b{font-size:15px;margin-bottom:1px}.go span{font-size:12px;line-height:1.25}
#hint{bottom:10%}}
body[data-gfx=low] .node.cur::after,body[data-gfx=low] #win #wi{animation:none}
body[data-gfx=low] #win.w #wi{filter:none}
</style>
</head>
<body>
<div id="menu" class="scr on">
  <div id="top">
    <img id="logo" src="icon.svg" alt="">
    <h1>Hố Đen 3D<small id="prog"></small></h1>
    <button class="ib skb" id="sb" title="Quản lý Skin hố đen"><canvas id="sbc" width="64" height="64"></canvas><span id="sbt">Skin</span></button>
    <div class="ib" id="jp" title="Về màn hiện tại">⌖</div>
    <div class="ib" id="mm" title="Nhạc nền">♪</div>
    <div class="ib" id="st" title="Cài đặt đồ hoạ">⚙</div>
  </div>
  <div id="map"><div id="road"></div></div>
  <button class="btn" id="rg">▶ Tiếp tục màn đang chơi</button>
</div>
<div id="game" class="scr">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div class="ib" id="bk" title="Về bản đồ">☰</div>
    <div id="lv"></div>
    <div id="bar"><div id="fill"></div></div>
    <div id="hb">
      <div class="ib" id="gsb" title="Quản lý Skin hố đen">🎨</div>
      <div class="ib" id="ps" title="Tạm dừng">❚❚</div>
      <div class="ib" id="lb" title="Hiện điểm số">#</div>
      <div class="ib" id="gm" title="Nhạc nền">♪</div>
      <div class="ib" id="gs" title="Cài đặt đồ hoạ">⚙</div>
      <div class="ib" id="rs" title="Chơi lại">↻</div>
    </div>
  </div>
  <div id="pz"><h2>⏸ Tạm dừng</h2><button class="btn" id="pr">Tiếp tục</button><button class="btn alt" id="pm">Về bản đồ</button></div>
  <div id="hint">Chạm giữ và kéo để di chuyển hố đen</div>
  <div id="win"><div id="cf"></div><div id="wc"><div id="wt0"><div id="wi"></div><div id="ws"></div><h2 id="wt"></h2><div id="wd" style="opacity:.8"></div></div><div id="wb"><button class="btn" id="nx">Màn tiếp theo</button><button class="btn alt" id="rp">Chơi lại</button><button class="btn alt" id="wm">Bản đồ</button></div></div></div>
</div>
<div id="skm">
  <div class="box">
    <h2>🎨 Quản lý Skin Hố Đen 3D</h2>
    <div class="sub">Chọn 1 trong 20 skin bên dưới để sử dụng cố định (không đổi ngẫu nhiên nữa)</div>
    <div id="skst"></div>
    <div id="sg"></div>
    <button class="btn" id="skx" style="width:100%">Xong</button>
  </div>
</div>
<div id="set">
  <div class="box">
    <h2>⚙ Cài đặt đồ hoạ 3D</h2>
    <div class="sub">Chọn chế độ phù hợp với máy của bạn</div>
    <div id="gl"></div>
    <button class="btn" id="sx" style="width:100%">Đóng</button>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const MAXL=10000,START_PTS=5;
let done=0,musicOn=true,showLb=true;
try{done=+localStorage.getItem('bh_done')||0;showLb=localStorage.getItem('bh_lb')!=='0'}catch(e){}
const save=()=>{try{localStorage.setItem('bh_done',done);localStorage.setItem('bh_lb',showLb?1:0)}catch(e){}};

/* ---------- icon PNG cho iOS ---------- */
(function(){const s=180,c=document.createElement('canvas');c.width=c.height=s;const g=c.getContext('2d');
let gr=g.createLinearGradient(0,0,s,s);gr.addColorStop(0,'#3b1d7a');gr.addColorStop(1,'#0e0722');g.fillStyle=gr;g.fillRect(0,0,s,s);
g.fillStyle='#4aa3df';g.fillRect(25,115,21,50);g.fillStyle='#f2c14e';g.fillRect(50,130,18,35);g.fillStyle='#d9534f';g.fillRect(115,122,25,43);
gr=g.createRadialGradient(90,88,30,90,88,44);gr.addColorStop(0,'#000');gr.addColorStop(1,'#8a5cff');g.fillStyle=gr;g.beginPath();g.arc(90,88,44,0,7);g.fill();
g.fillStyle='#000';g.beginPath();g.arc(90,88,14,0,7);g.fill();$('ati').href=c.toDataURL()})();

/* ---------- âm thanh (hỗ trợ tốt iPhone / iOS Safari) ---------- */
let AC=null,mt=null,step=0,auUnlocked=false;
function unlockIOS(){
  if(auUnlocked)return;
  try{
    const a=document.createElement('audio');
    a.setAttribute('playsinline','');
    a.src='data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
    a.volume=0.01;
    const p=a.play();
    if(p&&p.then)p.then(()=>{a.pause();auUnlocked=true}).catch(()=>{});
    else auUnlocked=true;
  }catch(e){}
}
function ac(force){
  const Ctx=window.AudioContext||window.webkitAudioContext;
  if(!Ctx)return null;
  if(!AC||AC.state==='closed'){try{AC=new Ctx()}catch(e){return null}}
  if(AC.state!=='running'){
    try{
      const p=AC.resume();
      if(p&&p.catch)p.catch(()=>{});
      if(force){
        const b=AC.createBuffer(1,1,22050),s=AC.createBufferSource();
        s.buffer=b;s.connect(AC.destination);s.start(0);
      }
    }catch(e){}
  }
  return AC;
}
function tone(f,t,d,type,v){
  if(!AC||AC.state!=='running')return;
  try{
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(v,t);
    g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(AC.destination);
    o.onended=()=>{try{o.disconnect();g.disconnect()}catch(e){}};
    o.start(t);o.stop(t+d+.02);
  }catch(e){}
}
const hz=n=>110*Math.pow(2,n/12);
function tick(){
  if(!musicOn)return;
  if(!AC||AC.state!=='running'){ac();return}
  const t=AC.currentTime+.05,roots=[0,5,3,7],r=roots[(step>>3)&3],pat=[0,3,7,12,10,7,3,7],sc=[0,3,5,7,10,12];
  if(step%2===0)tone(hz(r-12),t,.4,'triangle',.16);
  tone(hz(r+12+pat[step%8]),t,.22,'sine',.07);
  if(step%8===4&&cfg.q>=1.3)tone(hz(r+24+sc[(step*3)%6]),t,.5,'sine',.05);
  step++;
}
function music(){
  ac();
  if(musicOn&&!mt)mt=setInterval(tick,240);
  if(!musicOn&&mt){clearInterval(mt);mt=null}
}
function setMusic(v){
  musicOn=v;
  ['mm','gm'].forEach(i=>$(i).classList.toggle('off',!v));
  if(v){unlockIOS();ac(true)}
  music();
}
function sfx(k){
  if(!musicOn)return;
  ac();
  if(!AC||AC.state!=='running')return;
  const t=AC.currentTime;
  tone(300+k*45,t,.14,'sine',.18);
  tone(150+k*20,t,.2,'triangle',.12);
}
function jingle(ok){
  if(!musicOn)return;
  ac(true);
  if(!AC||AC.state!=='running')return;
  const t0=AC.currentTime+.1;
  if(ok){
    const n=[12,16,19,24,19,24,28,31],d=.14;
    n.forEach((x,i)=>{tone(hz(x),t0+i*d,.3,'square',.08);tone(hz(x-12),t0+i*d,.3,'triangle',.1)});
    let t=t0+n.length*d+.05;
    [0,4,7,12,16].forEach(x=>tone(hz(x+12),t,.9,'triangle',.1));
    [24,28,31].forEach(x=>tone(hz(x),t,.9,'sine',.06));
    t+=.95;
    [7,12,16,19,24].forEach(x=>tone(hz(x+12),t,1.3,'triangle',.1));
    [28,31,36].forEach(x=>tone(hz(x),t,1.3,'sine',.06));
  }else{
    const n=[19,18,17,12],ds=[.5,.5,.5,1.3];let t=t0;
    n.forEach((x,i)=>{tone(hz(x),t,ds[i]+.15,'triangle',.15);tone(hz(x-12),t,ds[i]+.15,'sine',.1);t+=ds[i]});
  }
}
function wakeAudio(){
  unlockIOS();
  const prev=AC?AC.state:'';
  ac(true);
  if(musicOn&&!$('win').classList.contains('on'))music();
  if(AC&&AC.state!=='running'&&prev==='interrupted'){
    setTimeout(()=>{
      if(AC&&AC.state!=='running'){
        try{AC.close()}catch(e){}
        AC=null;ac(true);if(musicOn)music();
      }
    },180);
  }
}
['pointerdown','touchstart','touchend','click','keydown'].forEach(ev=>document.addEventListener(ev,wakeAudio,{passive:true}));
function tap(el,fn){
  let id=null,sx=0,sy=0,lf=-1e9;
  const go=e=>{const t=performance.now();if(t-lf<450)return;lf=t;fn(e)};

      for(let k=kx0;k<=kx1;k++){ctx.fillRect(k*G-RW/2,ya,6,yb-ya);ctx.fillRect(k*G+RW/2-6,ya,6,yb-ya)}
      for(let k=ky0;k<=ky1;k++){ctx.fillRect(xa,k*G-RW/2,xb-xa,6);ctx.fillRect(xa,k*G+RW/2-6,xb-xa,6)}}
    if(cfg.detail&&B.dash){ctx.fillStyle='rgba(255,255,255,.72)';const e=RW/2;
      for(let a=kx0;a<=kx1;a++)for(let b=ky0;b<=ky1;b++){const cx=a*G,cy=b*G;
        for(let i=-3;i<=3;i++){const o=i*9-2.5;ctx.fillRect(cx+o,cy-e-20,5,14);ctx.fillRect(cx+o,cy+e+6,5,14);ctx.fillRect(cx-e-20,cy+o,14,5);ctx.fillRect(cx+e+6,cy+o,14,5)}}}
    if(B.dash){ctx.strokeStyle='rgba(255,255,255,.48)';ctx.lineWidth=3;ctx.setLineDash([22,18]);ctx.beginPath();
      const da=Math.floor(ya/40)*40,dxa=Math.floor(xa/40)*40;
      for(let k=kx0;k<=kx1;k++){ctx.moveTo(k*G,da);ctx.lineTo(k*G,yb)}
      for(let k=ky0;k<=ky1;k++){ctx.moveTo(dxa,k*G);ctx.lineTo(xb,k*G)}
      ctx.stroke();ctx.setLineDash([])}}
  ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=26;ctx.strokeRect(0,0,WS,WS);ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=5;ctx.strokeRect(0,0,WS,WS);
  const vw=CW/sc/2+90,vh=CH/sc/2+90,vis=o=>Math.abs(o.x-cam.x)<vw+o.w&&Math.abs(o.y-cam.y)<vh+o.h+o.hz;
  // hố đen 3D của người chơi
  const R=hole.R,hx=hole.x,hy=hole.y;
  if(cfg.light)ctx.drawImage(LIGHT,hx-R*4.6,hy-R*4.6,R*9.2,R*9.2);
  const hs=skinSprite();if(cfg.shadow)ctx.drawImage(PIT,hx-R*2.0,hy-R*2.0,R*4.0,R*4.0);
  // Vẽ sprite hố 3D kích thước chuẩn (bán kính vòng = 100/340 cạnh -> 3.4 * R)
  ctx.drawImage(hs,hx-R*1.7,hy-R*1.7,R*3.4,R*3.4);
  if(cfg.swirl&&hs.sw){ctx.save();ctx.translate(hx,hy);ctx.rotate(TT*.9);ctx.globalAlpha=.32;ctx.drawImage(hs.sw,-R*.78,-R*.78,R*1.56,R*1.56);ctx.restore();ctx.globalAlpha=1}
  if(cfg.bloom){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.08;ctx.drawImage(hs,hx-R*1.85,hy-R*1.85,R*3.7,R*3.7);ctx.globalCompositeOperation='source-over'}
  if(hole.pulse>0){ctx.globalAlpha=hole.pulse*.55;ctx.strokeStyle=SK[skinI][3];ctx.lineWidth=Math.max(2,R*.06);ctx.beginPath();ctx.arc(hx,hy,R*(1.04+(1-hole.pulse)*.45),0,7);ctx.stroke();ctx.globalAlpha=1}
  // Vật thể đang bị hút vào hố: cắt gọn vào lòng miệng hố khi rơi sâu để có cảm giác rơi tụt vào bên trong hố 3D
  for(const o of objs)if(o.f>=0&&o.f<1&&vis(o)){
    const tg=o.tg||hole;
    if(o.f>.22&&tg.R){ctx.save();ctx.beginPath();ctx.arc(tg.x,tg.y,tg.R*.82,0,7);ctx.clip();drawObj(o,1-o.f*.72);ctx.restore()}
    else drawObj(o,1-o.f*.72);
  }
  for(const b of bots)if(!(b.sp>0)&&Math.abs(b.x-cam.x)<vx+b.R*2&&Math.abs(b.y-cam.y)<vy+b.R*2)drawBot(b);
  for(const o of objs)if(o.f<0&&vis(o))drawObj(o,1);
  let lf='';const SF=f=>{if(f!==lf)ctx.font=lf=f};
  if(showLb){ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';ctx.strokeStyle='rgba(0,0,0,.85)';
    for(const o of objs){if(o.f>=0||!vis(o))continue;const fs=Math.max(8/sc,Math.min(13/sc,o.w*1.5+8)),y=o.y-o.h-o.hz*.9-fs*.7;
      SF('bold '+fs+'px sans-serif');ctx.lineWidth=fs*.3;ctx.fillStyle=o.pts<score?'#7dffb0':'#ff8a8a';ctx.strokeText(o.pts,o.x,y);ctx.fillText(o.pts,o.x,y)}
    for(const b of bots){if(b.sp>0||b.f>=0||Math.abs(b.x-cam.x)>vx+b.R||Math.abs(b.y-cam.y)>vy+b.R)continue;const fs=Math.max(10/sc,b.R*.4),t=''+b.P,y=b.y+b.R*.5;
      SF('bold '+fs+'px sans-serif');ctx.lineWidth=fs*.3;ctx.fillStyle='#fff';ctx.strokeText(t,b.x,y);ctx.fillText(t,b.x,y)}
    if(!dead){const fs=Math.max(11/sc,hole.R*.48),t=''+score;SF('bold '+fs+'px sans-serif');ctx.lineWidth=fs*.3;ctx.fillStyle='#fff';ctx.strokeText(t,hole.x,hole.y+hole.R*.12);ctx.fillText(t,hole.x,hole.y+hole.R*.12)}
    ctx.textBaseline='alphabetic'}
  SF('bold 18px sans-serif');ctx.textAlign='center';
  for(const f of fx){ctx.globalAlpha=1-f.t/.8;ctx.fillStyle='#fff';ctx.strokeStyle='#000';ctx.lineWidth=3;
    ctx.strokeText(f.s,f.x,f.y-20-f.t*40);ctx.fillText(f.s,f.x,f.y-20-f.t*40)}
  if(spk.length){ctx.fillStyle=SK[skinI][4];const z=4/sc;if(cfg.detail>1)ctx.globalCompositeOperation='lighter';
    for(const q of spk){const k=Math.max(0,1-q.t/.5);ctx.globalAlpha=k;if(cfg.detail){ctx.beginPath();ctx.arc(q.x,q.y,z*(.35+.65*k),0,7);ctx.fill()}else ctx.fillRect(q.x-z/2,q.y-z/2,z,z)}
    ctx.globalCompositeOperation='source-over'}
  ctx.globalAlpha=1;
  if(vig){ctx.setTransform(sx,0,0,sy,0,0);ctx.fillStyle=vig;ctx.fillRect(0,0,CW,CH)}
  if(js){ctx.setTransform(sx,0,0,sy,0,0);ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(js.sx,js.sy,40,0,7);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.5)';ctx.beginPath();ctx.arc(js.sx+Math.max(-40,Math.min(40,js.x-js.sx)),js.sy+Math.max(-40,Math.min(40,js.y-js.sy)),16,0,7);ctx.fill()}
}
let raf=0,idle=0,nextT=0,fr=0;
function startLoop(){cancelAnimationFrame(raf);idle=0;nextT=0;running=true;last=performance.now();raf=requestAnimationFrame(loop)}
function loop(t){if(!running)return;raf=requestAnimationFrame(loop);
  if(t<nextT-1.5)return;const iv=1000/cfg.fps;nextT=(t-nextT>iv)?t+iv:nextT+iv;
  const dt=Math.min(Math.max(t-last,0)/1000,.05);last=t;TT=t/1000;if((++fr&63)===0)resize();update(dt);draw();
  if(won||dead){idle+=dt;if(idle>2.5){running=false;cancelAnimationFrame(raf)}}}
const GN={ultra:['Siêu sắc nét 3D 4K','Đồ hoạ 3D cao nhất: độ phân giải tối đa, bóng đổ nghiêng, vỉa hè & vạch đường 3D, ánh sáng và hiệu ứng, 120Hz.'],normal:['Bình thường (3D sắc nét)','Đồ hoạ 3D sắc nét, bóng đổ và ánh sáng chi tiết, 60Hz mượt mà.'],low:['Dành cho máy yếu','Tiết kiệm pin: độ phân giải tối đa 1.5x, 60Hz, giảm hiệu ứng nặng.']};
function applyGfx(m){gm=m;cfg=GFX[m];document.body.dataset.gfx=m;try{localStorage.setItem('bh_gfx',m)}catch(e){}
  skinCache.length=0;for(const k in botSpr)delete botSpr[k];for(const k in objSpr)delete objSpr[k];resize();
  if(B&&theme){gPat=mkPat(B.g||theme[0]);lPat=mkPat(B.lane||theme[1])}
  if(!running&&hole&&B&&$('game').classList.contains('on')){try{draw()}catch(e){}}
  if(!running&&nextT>=0)nextT=0}
function drawGl(){$('gl').innerHTML='';for(const k of['ultra','normal','low']){const b=document.createElement('button');b.className='go'+(k===gm?' on':'');b.innerHTML='<b>'+GN[k][0]+'</b><span>'+GN[k][1]+'</span>';tap(b,()=>{applyGfx(k);drawGl()});$('gl').appendChild(b)}}
let wasRun=false;
function openSet(){wasRun=running;if(running){running=false;cancelAnimationFrame(raf)}drawGl();$('set').classList.add('on')}
function closeSet(){$('set').classList.remove('on');if(wasRun&&$('game').classList.contains('on'))startLoop();wasRun=false}
const TH=[];
function selectSkin(i){
  skinSel=i;
  if(i>=0){
    skinI=i;
    try{localStorage.setItem('bh_skin',i)}catch(e){}
  }else{
    try{localStorage.setItem('bh_skin','')}catch(e){}
    pickSkin();
  }
  updateSkinBtn();
  drawSk();
  if($('menu').classList.contains('on'))$('prog').textContent='Đã qua '+done+'/'+MAXL+' màn'+(skinSel>=0?' · Skin: '+SK[skinSel][0]:' · Skin ngẫu nhiên');
  if(hole&&B&&$('game').classList.contains('on')){try{draw()}catch(e){}}
}
function drawSk(){
  const g=$('sg');g.innerHTML='';
  $('skst').textContent=skinSel>=0
    ?'✅ Đang chọn cố định: #'+ (skinSel+1) +' '+SK[skinSel][0]+' (không đổi ngẫu nhiên)'
    :'🎲 Chế độ hiện tại: Sinh ngẫu nhiên skin mỗi màn';
  const rb=document.createElement('button');
  rb.className='sc rnd'+(skinSel<0?' on':'');
  rb.innerHTML='🎲 Ngẫu nhiên mỗi màn';
  tap(rb,()=>selectSkin(-1));
  g.appendChild(rb);
  SK.forEach((k,i)=>{
    const c=TH[i]||(TH[i]=mkSkinSprite(i,.55)),w=document.createElement('canvas');
    w.width=w.height=160;w.getContext('2d').drawImage(c,0,0,160,160);
    const b=document.createElement('button');
    b.className='sc'+(skinSel===i?' on':'');
    const tg=document.createElement('span');tg.className='tg';tg.textContent='#'+(i+1);b.appendChild(tg);
    b.appendChild(w);
    const t=document.createElement('div');t.className='nm';t.textContent=k[0];b.appendChild(t);
    tap(b,()=>selectSkin(i));
    g.appendChild(b);
  });
}
let wasRunSk=false;
function openSk(){wasRunSk=running;if(running){running=false;cancelAnimationFrame(raf)}drawSk();$('skm').classList.add('on')}
function closeSk(){$('skm').classList.remove('on');if(wasRunSk&&$('game').classList.contains('on'))startLoop();wasRunSk=false}
tap($('sb'),openSk);tap($('gsb'),openSk);tap($('skx'),closeSk);
tap($('st'),openSet);tap($('gs'),openSet);tap($('sx'),closeSet);
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(mt){clearInterval(mt);mt=null}}else{if(running){last=performance.now();nextT=0}resize();wakeAudio()}});
window.addEventListener('pageshow',wakeAudio);
window.addEventListener('focus',wakeAudio);

updateSkinBtn();
buildMap();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{off=true;$('prog').textContent+=' · chơi offline được'}).catch(()=>{})}
