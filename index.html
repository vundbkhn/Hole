<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Hố Đen Thành Phố</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" id="ati" href="icon.svg">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b1033">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#120a26;color:#fff;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden;touch-action:none}
.scr{position:fixed;inset:0;display:none}
.scr.on{display:block}
#menu{background:radial-gradient(ellipse at 50% 0,#3b1d7a 0,#120a26 70%)}
#top{position:absolute;left:0;right:0;top:0;z-index:5;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;display:flex;align-items:center;gap:10px;background:linear-gradient(#120a26 60%,transparent)}
#top img{width:44px;height:44px;border-radius:12px}
#top h1{margin:0;font-size:20px;line-height:1.1;flex:1;letter-spacing:.3px}
#top small{display:block;font-weight:400;font-size:12px;opacity:.7}
.ib{width:42px;height:42px;border-radius:50%;border:2px solid #8a5cff;background:#241247;color:#fff;font-size:19px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ib.off{opacity:.45;border-color:#555}
#map{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
#road{position:relative;width:100%;max-width:520px;margin:0 auto}
#road svg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;border:3px solid #4b3a78;background:#241247;color:#8d7fb5;font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.node.done{background:#2e9b6a;border-color:#7dffc0;color:#fff}
.node.cur{background:#8a5cff;border-color:#fff;color:#fff;animation:pl 1.2s infinite}
.node.lock{cursor:default}
@keyframes pl{50%{box-shadow:0 0 0 12px rgba(138,92,255,.25)}}
.ban{position:absolute;left:50%;transform:translateX(-50%);padding:4px 12px;border-radius:14px;background:#241247dd;font-size:13px;border:1px solid #8a5cff;white-space:nowrap;pointer-events:none}
#game{background:#000}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#hud{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 0;display:flex;align-items:center;gap:8px;pointer-events:none}
#hud .ib{pointer-events:auto;width:38px;height:38px;font-size:16px}
#lv{font-weight:700;font-size:15px;min-width:54px}
#bar{flex:1;height:14px;border-radius:7px;background:rgba(0,0,0,.45);border:2px solid #fff3;overflow:hidden}
#fill{height:100%;width:0;background:linear-gradient(90deg,#8a5cff,#ff8ad8)}
#hint{position:absolute;left:0;right:0;bottom:18%;text-align:center;font-size:16px;opacity:.9;pointer-events:none;text-shadow:0 2px 6px #000;transition:opacity .6s}
#win{position:absolute;inset:0;background:rgba(10,5,25,.82);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:20px}
#win.on{display:flex}
#win h2{font-size:30px;margin:0}
.btn{min-width:200px;padding:13px 22px;border-radius:26px;border:0;background:#8a5cff;color:#fff;font-size:17px;font-weight:700;cursor:pointer;font-family:inherit}
.btn.alt{background:#2c1b57}
</style>
</head>
<body>
<div id="menu" class="scr on">
  <div id="top"><img id="logo" src="icon.svg" alt=""><h1>Hố Đen Thành Phố<small id="prog"></small></h1><div class="ib" id="jp" title="Về màn hiện tại">⌖</div><div class="ib" id="mm" title="Nhạc nền">♪</div></div>
  <div id="map"><div id="road"></div></div>
</div>
<div id="game" class="scr">
  <canvas id="cv"></canvas>
  <div id="hud"><div class="ib" id="bk">☰</div><div id="lv"></div><div id="bar"><div id="fill"></div></div><div class="ib" id="gm">♪</div><div class="ib" id="rs">↻</div></div>
  <div id="hint">Chạm giữ và kéo để di chuyển hố đen</div>
  <div id="win"><h2 id="wt"></h2><div id="wd" style="opacity:.8"></div><button class="btn" id="nx">Màn tiếp theo</button><button class="btn alt" id="rp">Chơi lại</button><button class="btn alt" id="wm">Bản đồ</button></div>
</div>
<script>
const $=id=>document.getElementById(id);
const MAXL=10000;
let done=0,musicOn=true;
try{done=+localStorage.getItem('bh_done')||0;musicOn=localStorage.getItem('bh_music')!=='0'}catch(e){}
const save=()=>{try{localStorage.setItem('bh_done',done);localStorage.setItem('bh_music',musicOn?1:0)}catch(e){}};

/* ---------- icon PNG cho iOS ---------- */
(function(){const s=180,c=document.createElement('canvas');c.width=c.height=s;const g=c.getContext('2d');
let gr=g.createLinearGradient(0,0,s,s);gr.addColorStop(0,'#3b1d7a');gr.addColorStop(1,'#0e0722');g.fillStyle=gr;g.fillRect(0,0,s,s);
g.fillStyle='#4aa3df';g.fillRect(25,115,21,50);g.fillStyle='#f2c14e';g.fillRect(50,130,18,35);g.fillStyle='#d9534f';g.fillRect(115,122,25,43);
gr=g.createRadialGradient(90,88,30,90,88,44);gr.addColorStop(0,'#000');gr.addColorStop(1,'#8a5cff');g.fillStyle=gr;g.beginPath();g.arc(90,88,44,0,7);g.fill();
g.fillStyle='#000';g.beginPath();g.arc(90,88,14,0,7);g.fill();$('ati').href=c.toDataURL()})();

/* ---------- âm thanh ---------- */
let AC=null,mt=null,step=0;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,t,d,type,v){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}
const hz=n=>110*Math.pow(2,n/12);
function tick(){if(!AC||!musicOn)return;const t=AC.currentTime+.05,roots=[0,5,3,7],r=roots[(step>>3)&3],pat=[0,3,7,12,10,7,3,7],sc=[0,3,5,7,10,12];
if(step%2===0)tone(hz(r-12),t,.4,'triangle',.16);
tone(hz(r+12+pat[step%8]),t,.22,'sine',.07);
if(step%8===4)tone(hz(r+24+sc[(step*3)%6]),t,.5,'sine',.05);
step++}
function music(){if(!ac())return;if(musicOn&&!mt)mt=setInterval(tick,240);if(!musicOn&&mt){clearInterval(mt);mt=null}}
function setMusic(v){musicOn=v;save();['mm','gm'].forEach(i=>$(i).classList.toggle('off',!v));music()}
function sfx(k){if(!AC)return;const t=AC.currentTime;tone(300+k*45,t,.14,'sine',.18);tone(150+k*20,t,.2,'triangle',.12)}
document.addEventListener('pointerdown',()=>{ac();music()},{passive:true});
['mm','gm'].forEach(i=>$(i).onclick=()=>setMusic(!musicOn));
setMusic(musicOn);

/* ---------- chủ đề map (đổi lần lượt, mỗi 5 màn) ---------- */
const BIO=[
{n:'Thành phố',k:['cone','person','bin','bench','tree','car','bus','house','building','tower'],mv:{1:25,5:70,6:45},ic:'🏙️',acc:'#7dffc0',dash:1},
{n:'Dòng sông',k:['reed','duck','log','rock','tree','boat','ship','house','building','tower'],mv:{1:22,5:55,6:35},ic:'🏞️',acc:'#4cc9f0',g:'#3f7d4e',lane:'#2f8fd4',LW:100,deco:'f',col:['#9acd32','#ffe066','#8d6e63','#b0bec5','#2e7d32','#ffb74d','#fff176','#a1887f','#78909c','#4e8f6a']},
{n:'Biển xanh',k:['crab','fish','jelly','shell','weed','boat','ship','island','iceberg','whale'],mv:{0:40,1:50,2:35,5:60,6:40,7:15},ic:'🌊',acc:'#2ec4b6',g:'#1d78b0',free:1,deco:'w',sh:{7:'c',8:'c',9:'c'},col:['#ff7f50','#ffd166','#ff6b9d','#c8b6ff','#2ec4b6','#ffb703','#e76f51','#8d99ae','#adb5bd','#ced4da']},
{n:'Đại dương',k:['fish','fish','jelly','shell','weed','boat','ship','whale','island','iceberg'],mv:{0:45,1:55,2:40,5:50,6:35,7:20},ic:'🐋',acc:'#4361ee',g:'#0b2a5b',free:1,deco:'w',sh:{7:'c',8:'c',9:'c'},col:['#48cae4','#90e0ef','#c77dff','#ff9e00','#06d6a0','#4361ee','#7209b7','#5f6c7b','#3a506b','#e0e1dd']},
{n:'Rừng cây',k:['mush','deer','log','rock','tree','cart','cart','pine','pine','pine'],mv:{1:35,2:20},ic:'🌲',acc:'#90be6b',g:'#1f5a30',lane:'#7a5c3a',deco:'f',sh:{7:'c',8:'c',9:'c'},col:['#ff6b6b','#c9a227','#6b4423','#8a8a8a','#2e9b4f','#a0522d','#8b5a2b','#3f7f3f','#2d6a2d','#1f5e1f']},
{n:'Công viên',k:['flower','person','bush','bench','tree','cart','bus','pavil','fountain','wheel'],mv:{1:25,2:20,5:30},ic:'🌳',acc:'#ff80ab',g:'#4caf50',lane:'#d7ccc8',deco:'f',sh:{8:'c',9:'c'},col:['#ff80ab','#ffd166','#26a69a','#8d6e63','#43a047','#42a5f5','#ab47bc','#ef5350','#8e7cc3','#fdd835']},
{n:'Thiên hà',k:['comet','star','planet','star','planet','planet','ring','planet','gas','sun'],mv:{0:60,1:50,2:40,5:30,6:25},ic:'🌌',acc:'#c77dff',g:'#0a0420',free:1,deco:'s',all:'c',col:['#c77dff','#80ffdb','#ffd60a','#ff5d8f','#4cc9f0','#ff9e00','#f72585','#7b2cbf','#3a86ff','#fb5607']}];
const bio=n=>BIO[((n-1)/5|0)%BIO.length];

/* ---------- bản đồ chọn màn (chỉ vẽ phần đang nhìn thấy) ---------- */
let rs=-1,rt=0;
const nodeX=i=>50+Math.sin(i*.8)*28,nodeY=i=>(MAXL-i)*88+70;
function renderMap(force){
  const m=$('map'),vh=m.clientHeight,st=m.scrollTop-80,pd=vh*1.2;
  const lo=Math.max(1,Math.floor(MAXL-(st+vh+pd-70)/88)),hi=Math.min(MAXL,Math.ceil(MAXL-(st-pd-70)/88));
  if(!force&&rs>0&&Math.abs(lo-rs)<10)return;rs=lo;
  const cur=Math.min(done+1,MAXL),top=nodeY(hi)-44,hg=(hi-lo)*88+88,pt=i=>nodeX(i).toFixed(1)+' '+(nodeY(i)-top);
  const path=(a,b,st,ex)=>{if(b<=a)return '';let d='';for(let i=b;i>=a;i--)d+=(i===b?'M':'L')+pt(i)+' ';return `<path d="${d}" fill="none" ${st} stroke-width="5" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`};
  let h=`<div style="position:absolute;left:0;right:0;top:${top}px;height:${hg}px"><svg viewBox="0 0 100 ${hg}" preserveAspectRatio="none">${path(Math.max(lo,cur),hi,'stroke="#4b3a78" stroke-dasharray="3 9"')}${path(lo,Math.min(hi,cur),'stroke="#8a5cff"')}</svg></div>`;
  for(let i=hi;i>=lo;i--){const b=bio(i),c=i<=done?'done':i===done+1?'cur':'lock';
    h+=`<div class="node ${c}" data-n="${i}" style="left:${nodeX(i)}%;top:${nodeY(i)}px;border-color:${c==='cur'?'#fff':b.acc}${c==='done'?';background:'+b.acc+';color:#0d0820':''}">${i<=done+1?i:'🔒'}</div>`;
    if((i-1)%5===0)h+=`<div class="ban" style="top:${nodeY(i)+46}px">${b.ic} ${b.n}</div>`}
  $('road').innerHTML=h;
}
function buildMap(){
  const m=$('map'),road=$('road'),cur=Math.min(done+1,MAXL);
  road.style.height=(MAXL*88+140)+'px';rs=-1;
  $('prog').textContent='Đã qua '+done+'/'+MAXL+' màn';
  m.scrollTop=nodeY(cur)+80-m.clientHeight/2;renderMap(true);
}
$('road').onclick=e=>{const n=+(e.target.dataset&&e.target.dataset.n);if(n&&n<=done+1)play(n)};
$('map').addEventListener('scroll',()=>{cancelAnimationFrame(rt);rt=requestAnimationFrame(()=>renderMap())},{passive:true});
$('jp').onclick=buildMap;

/* ---------- dữ liệu vật thể ---------- */
// [r, need, pts, color, shape, height]
const T=[[5,10,1,'#ff8a2b','c',4],[6,12,2,'#ffd166','c',6],[7,14,3,'#3ddc97','c',8],[9,18,4,'#b5835a','r',5],[12,24,6,'#2e9b4f','c',14],
[16,32,10,'#e63946','r',8],[24,48,25,'#f2c14e','r',12],[30,60,30,'#d9534f','r',16],[44,85,60,'#6c7a9c','r',40],[60,120,120,'#4aa3df','r',70]];
const CARC=['#e63946','#4cc9f0','#f72585','#90be6b','#f9c74f','#ffffff'];
const THEMES=[['#2d5a3d','#363b48'],['#3b4a6b','#2b3040'],['#6b5a3a','#403d38'],['#5a3a6b','#352c42'],['#3a6b6b','#2b3b3e']];
const shade=(c,k)=>{const n=parseInt(c.slice(1),16),m=v=>Math.min(255,v*k|0);return `rgb(${m(n>>16)},${m(n>>8&255)},${m(n&255)})`};
const rad=S=>16+3.4*Math.sqrt(S);
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- game ---------- */
const cv=$('cv'),ctx=cv.getContext('2d');
let TT=0,B,deco=[],CW,CH,DPR,lvl=1,objs=[],fx=[],hole,score,total,eaten,WS,theme,cam,sc,js=null,running=false,last=0,won=false,G=320,RW=70,combo=0;
function resize(){DPR=Math.min(devicePixelRatio||1,2);CW=innerWidth;CH=innerHeight;cv.width=CW*DPR;cv.height=CH*DPR}
addEventListener('resize',resize);resize();

function gen(n){
  B=bio(n);RW=B.LW||70;const d=Math.min(n,300),r=rng(n*7919+13);WS=1300+d*10;theme=THEMES[((n-1)/35|0)%5];
  const N=Math.min(150+d*3,560),w=T.map((t,i)=>[10,10,7,5,8,7,3,4,3,1][i]*(.55+Math.min(n,150)/35)**(i/4)),sw=w.reduce((a,b)=>a+b),L=[];
  const dR=v=>{const m=v%G;return Math.min(m,G-m)},nl=Math.floor(WS/G);
  const hx=G*(nl>>1),hy=G*(nl>>1);
  for(let k=0;k<N*4&&L.length<N;k++){
    let q=r()*sw,i=0;while(q>w[i]){q-=w[i];i++}
    const t=T[i],s=.9+r()*.25,rr=t[0]*s;let x,y,hw=rr,hh=rr,c=B.col?B.col[i]:t[3];
    if(i===3){hw=rr*1.6;hh=rr*.7}
    if((i===5||i===6)&&!B.free){const hor=r()<.5,ln=(1+(r()*(nl-1)|0))*G+(r()-.5)*RW*.5,al=60+r()*(WS-120),a=rr*(i===6?1.9:1.3),b=rr*.6;
      x=hor?al:ln;y=hor?ln:al;hw=hor?a:b;hh=hor?b:a;if(i===5&&!B.col)c=CARC[r()*6|0]}
    else{x=60+r()*(WS-120);y=60+r()*(WS-120);
      if(i>=3&&!B.free){const m=RW/2+Math.max(hw,hh)+4;if(dR(x)<m||dR(y)<m){k++;continue}}}
    const sp=B.all||(B.sh&&B.sh[i])||t[4];if(sp==='c')hw=hh=Math.max(hw,hh);if(Math.hypot(x-hx,y-hy)<90)continue;
    let ok=true;for(const o of L)if(Math.abs(o.x-x)<o.w+hw+2&&Math.abs(o.y-y)<o.h+hh+2){ok=false;break}
    if(ok)L.push({x,y,w:hw,h:hh,need:t[1],pts:t[2],c,d:shade(c,.6),sh:sp,hz:t[5],f:-1,i,vx:0,vy:0,ms:B.mv&&B.mv[i]?B.mv[i]*(.7+r()*.6):0,tm:r()*3,ln:(i===5||i===6)&&!B.free})}
  // loại vật thể không thể ăn được theo tiến trình tăng kích thước
  L.sort((a,b)=>a.need-b.need);let S=0;const keep=[];
  for(const o of L){if(o.need<=rad(S)){keep.push(o);S+=o.pts}}
  keep.sort((a,b)=>a.y-b.y);objs=keep;total=keep.length;
  hole={x:hx,y:hy,R:rad(0),tr:rad(0)};deco=[];const dn=B.deco?(B.deco==='s'?320:200):0;for(let k=0;k<dn;k++)deco.push({x:r()*WS,y:r()*WS,r:B.deco==='w'?20+r()*30:B.deco==='s'?1.5+r()*3.5:3+r()*4,a:.3+r()*.7});
}
function play(n){
  lvl=n;gen(n);initMove();score=0;eaten=0;fx=[];won=false;js=null;combo=0;
  cam={x:hole.x,y:hole.y};sc=Math.min(CW,CH)/(260+hole.R*6);
  $('menu').classList.remove('on');$('game').classList.add('on');$('win').classList.remove('on');
  $('lv').textContent=B.ic+' Màn '+n;$('fill').style.width='0';
  const h=$('hint');h.textContent=B.ic+' '+B.n+': chạm giữ và kéo để di chuyển';h.style.opacity=1;setTimeout(()=>h.style.opacity=0,3500);
  running=true;last=performance.now();requestAnimationFrame(loop);music();
}
function toMenu(){running=false;$('game').classList.remove('on');$('menu').classList.add('on');buildMap()}
$('bk').onclick=toMenu;$('wm').onclick=toMenu;$('rs').onclick=()=>play(lvl);$('rp').onclick=()=>play(lvl);
$('nx').onclick=()=>play(Math.min(lvl+1,MAXL));

/* điều khiển: chạm giữ + kéo */
cv.addEventListener('pointerdown',e=>{js={sx:e.clientX,sy:e.clientY,x:e.clientX,y:e.clientY,id:e.pointerId};cv.setPointerCapture(e.pointerId);$('hint').style.opacity=0});
cv.addEventListener('pointermove',e=>{if(js&&js.id===e.pointerId){js.x=e.clientX;js.y=e.clientY}});
const up=e=>{if(js&&js.id===e.pointerId)js=null};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);

function initMove(){for(const o of objs)if(o.ms){let a=Math.random()*6.283;
  if(o.ln)a=o.w>o.h?(Math.random()<.5?0:Math.PI):(Math.random()<.5?1.5708:-1.5708);
  o.vx=Math.cos(a)*o.ms;o.vy=Math.sin(a)*o.ms}}
function moveObj(o,dt){
  if(!o.ln){const dx=o.x-hole.x,dy=o.y-hole.y,l=Math.hypot(dx,dy);
    if(o.need<=hole.R&&l<hole.R*2.2&&l>1){o.vx=dx/l*o.ms*1.4;o.vy=dy/l*o.ms*1.4;o.tm=1.5}
    else{o.tm-=dt;if(o.tm<=0){o.tm=2+Math.random()*4;const a=Math.random()*6.283;o.vx=Math.cos(a)*o.ms;o.vy=Math.sin(a)*o.ms}}}
  o.x+=o.vx*dt;o.y+=o.vy*dt;const m=40;
  if(o.x<m){o.x=m;o.vx=Math.abs(o.vx)}else if(o.x>WS-m){o.x=WS-m;o.vx=-Math.abs(o.vx)}
  if(o.y<m){o.y=m;o.vy=Math.abs(o.vy)}else if(o.y>WS-m){o.y=WS-m;o.vy=-Math.abs(o.vy)}
}
function update(dt){
  if(js){const dx=js.x-js.sx,dy=js.y-js.sy,l=Math.hypot(dx,dy);
    if(l>6){const m=Math.min(l/60,1),sp=(130+hole.R*.9)*m;hole.x+=dx/l*sp*dt;hole.y+=dy/l*sp*dt;
      if(l>90){js.sx+=dx/l*(l-90);js.sy+=dy/l*(l-90)}}}
  hole.x=Math.max(0,Math.min(WS,hole.x));hole.y=Math.max(0,Math.min(WS,hole.y));
  hole.R+=(hole.tr-hole.R)*Math.min(1,dt*6);
  const R=hole.R,lim=R+80;
  for(const o of objs){
    if(o.f>=1)continue;
    if(o.f>=0){o.f+=dt*3.5;o.x+=(hole.x-o.x)*Math.min(1,dt*9);o.y+=(hole.y-o.y)*Math.min(1,dt*9);continue}
    if(o.ms)moveObj(o,dt);
    if(o.need>R)continue;
    if(Math.abs(o.x-hole.x)>lim||Math.abs(o.y-hole.y)>lim)continue;
    if(Math.hypot(o.x-hole.x,o.y-hole.y)<R*.8){o.f=0;eaten++;score+=o.pts;hole.tr=rad(score);combo=Math.min(combo+1,12);sfx(combo);
      fx.push({x:o.x,y:o.y,t:0,s:'+'+o.pts});$('fill').style.width=(eaten/total*100)+'%'}}

island:(o,w,h,z,c)=>{C(0,0,w*1.12);FN('rgba(255,255,255,'+(.25+Math.sin(TT*2+o.x)*.08)+')');E(0,0,w,w*.92);FL('#f1d79a');E(0,-w*.05,w*.72,w*.62);FL('#3d9a52');
  for(const a of[[-.3,-.1],[.3,.15],[.05,-.35]]){ctx.strokeStyle='#7a4a2a';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(a[0]*w,a[1]*w);ctx.lineTo(a[0]*w+3,a[1]*w-w*.5);ctx.stroke();
    for(let i=0;i<5;i++){ctx.save();ctx.translate(a[0]*w+3,a[1]*w-w*.5);ctx.rotate(i*1.257);E(w*.2,0,w*.22,w*.07);FL('#2ea04a');ctx.restore()}}},
iceberg:(o,w,h,z,c)=>{C(0,0,w*1.1);FN('rgba(180,230,255,.3)');ctx.save();blob(o,9,w,.2);FL('#e8f6ff');ctx.clip();
  ctx.strokeStyle='rgba(120,180,220,.55)';ctx.lineWidth=1.5;for(let i=0;i<9;i++){const a=i*.698;ctx.beginPath();ctx.moveTo(0,-w*.1);ctx.lineTo(Math.cos(a)*w,Math.sin(a)*w);ctx.stroke()}
  ctx.fillStyle='rgba(130,190,230,.35)';ctx.fillRect(-w,0,w*2,w);ctx.restore();blob(o,9,w,.2);ctx.lineWidth=2;ctx.strokeStyle='rgba(0,0,0,.25)';ctx.stroke()},
whale:(o,w,h,z,c,d,dr)=>{ctx.scale(dr,1);ctx.beginPath();ctx.moveTo(-w*.8,0);ctx.quadraticCurveTo(-w*1.1,-w*.2,-w*1.3,-w*.5);ctx.quadraticCurveTo(-w*1.2,-w*.1,-w*1.2,0);ctx.quadraticCurveTo(-w*1.2,w*.1,-w*1.3,w*.5);ctx.quadraticCurveTo(-w*1.1,w*.2,-w*.8,0);ctx.closePath();FL(shade(c,.85));
  E(0,0,w,w*.52);FL(c);E(w*.05,w*.2,w*.85,w*.26);FN('#dfe7ee');ctx.beginPath();ctx.moveTo(w*.1,w*.35);ctx.lineTo(-w*.2,w*.75);ctx.lineTo(-w*.3,w*.3);ctx.closePath();FL(shade(c,.8));
  C(w*.62,-w*.12,w*.07);FN('#111');ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(w*.95,w*.05);ctx.quadraticCurveTo(w*.6,w*.2,w*.3,w*.12);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.8)';for(let i=0;i<4;i++){C(w*.2+(i-1.5)*w*.1,-w*.55-Math.abs(Math.sin(TT*3+i))*w*.25,w*.07);ctx.fill()}},
planet:(o,w,h,z,c)=>{C(0,0,w*1.3);FN(GR(0,0,w*.8,0,0,w*1.3,[[0,c+'55'],[1,c+'00']]));C(0,0,w);FN(GR(-w*.35,-w*.4,w*.1,0,0,w*1.05,[[0,shade(c,1.45)],[.55,c],[1,shade(c,.35)]]));
  for(let i=0;i<3;i++){C((hs(o,i)-.5)*w,(hs(o,i+5)-.5)*w,w*(.1+hs(o,i+9)*.12));FN('rgba(0,0,0,.16)')}},
star:(o,w,h,z,c)=>{const p=1+Math.sin(TT*3+o.x)*.08;C(0,0,w*1.8*p);FN(GR(0,0,0,0,0,w*1.8*p,[[0,c+'aa'],[1,c+'00']]));
  ctx.beginPath();for(let i=0;i<10;i++){const a=-1.5708+i*.6283,r=(i%2?w*.45:w)*p;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();FL(c);C(0,0,w*.25);FN('rgba(255,255,255,.7)')},
comet:(o,w,h,z,c,d,dr)=>{ctx.scale(dr,1);const g=ctx.createLinearGradient(0,0,-w*4.5,0);g.addColorStop(0,c+'cc');g.addColorStop(1,c+'00');ctx.beginPath();ctx.moveTo(0,-w*.8);ctx.lineTo(-w*4.5,0);ctx.lineTo(0,w*.8);ctx.closePath();FN(g);K.planet(o,w*.9,h,z,c)},
ring:(o,w,h,z,c)=>{ctx.beginPath();ctx.ellipse(0,0,w*1.7,w*.5,-.4,0,7);ctx.strokeStyle=shade(c,1.3);ctx.lineWidth=w*.2;ctx.globalAlpha=.8;ctx.stroke();ctx.globalAlpha=1;K.planet(o,w,h,z,c);
  ctx.beginPath();ctx.ellipse(0,0,w*1.7,w*.5,-.4,0,Math.PI);ctx.strokeStyle=shade(c,1.3);ctx.lineWidth=w*.2;ctx.stroke()},
gas:(o,w,h,z,c)=>{K.planet(o,w,h,z,c);ctx.save();C(0,0,w);ctx.clip();for(let i=-3;i<=3;i++){ctx.fillStyle=i%2?'rgba(255,255,255,.16)':'rgba(0,0,0,.16)';ctx.fillRect(-w,i*w*.28-w*.09,w*2,w*.18)}ctx.restore()},
sun:(o,w,h,z,c)=>{C(0,0,w*1.7);FN(GR(0,0,w*.5,0,0,w*1.7,[[0,'rgba(255,200,60,.6)'],[1,'rgba(255,120,0,0)']]));ctx.strokeStyle='rgba(255,190,60,.7)';ctx.lineWidth=w*.1;
  for(let i=0;i<14;i++){const a=i*.4488+TT*.3,r=w*(1.25+(i%2)*.2);ctx.beginPath();ctx.moveTo(Math.cos(a)*w*1.02,Math.sin(a)*w*1.02);ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);ctx.stroke()}
  C(0,0,w);FN(GR(-w*.2,-w*.2,w*.1,0,0,w,[[0,'#fff6b0'],[.5,'#ffc933'],[1,c]]))}};
function drawObj(o,s){
  const k=K[B.k[o.i]];ctx.save();ctx.translate(o.x,o.y);ctx.scale(s,s);if(o.f>0)ctx.rotate(o.f*5);
  if(B.deco!=='s'){ctx.fillStyle='rgba(0,0,0,.28)';E(2,3,o.w*1.05,o.h*.9);ctx.fill()}
  k(o,o.w,o.h,o.hz,o.c,o.d,o.vx<0?-1:1);ctx.restore();
}
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#0b0616';ctx.fillRect(0,0,CW,CH);
  ctx.setTransform(DPR*sc,0,0,DPR*sc,DPR*(CW/2-cam.x*sc),DPR*(CH/2-cam.y*sc));
  ctx.fillStyle=B.g||theme[0];ctx.fillRect(0,0,WS,WS);
  const vx=CW/sc/2+60,vy=CH/sc/2+60;
  if(B.deco){const st=B.deco==='s';ctx.strokeStyle='rgba(255,255,255,.18)';ctx.fillStyle=st?'#fff':'rgba(255,255,255,.14)';ctx.lineWidth=3;
    for(const q of deco){if(Math.abs(q.x-cam.x)>vx||Math.abs(q.y-cam.y)>vy)continue;
      if(B.deco==='w'){ctx.beginPath();ctx.moveTo(q.x-q.r,q.y);ctx.quadraticCurveTo(q.x,q.y-q.r*.6,q.x+q.r,q.y);ctx.stroke()}
      else{ctx.globalAlpha=st?q.a:1;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,7);ctx.fill()}}ctx.globalAlpha=1}
  if(!B.free){ctx.fillStyle=B.lane||theme[1];
    for(let k=1;k*G<WS;k++){ctx.fillRect(k*G-RW/2,0,RW,WS);ctx.fillRect(0,k*G-RW/2,WS,RW)}
    ctx.fillStyle='rgba(255,255,255,.13)';for(let k=1;k*G<WS;k++){for(const e of[-1,1]){ctx.fillRect(k*G+e*RW/2-(e<0?6:0),0,6,WS);ctx.fillRect(0,k*G+e*RW/2-(e<0?6:0),WS,6)}}
    if(B.dash){ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=3;ctx.setLineDash([22,18]);ctx.beginPath();
      for(let k=1;k*G<WS;k++){ctx.moveTo(k*G,0);ctx.lineTo(k*G,WS);ctx.moveTo(0,k*G);ctx.lineTo(WS,k*G)}
      ctx.stroke();ctx.setLineDash([])}}
  ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=6;ctx.strokeRect(0,0,WS,WS);
  const vw=CW/sc/2+90,vh=CH/sc/2+90,vis=o=>Math.abs(o.x-cam.x)<vw+o.w&&Math.abs(o.y-cam.y)<vh+o.h+o.hz;
  for(const o of objs)if(o.f>=0&&o.f<1&&vis(o))drawObj(o,1-o.f);
  // hố đen
  const R=hole.R,hx=hole.x,hy=hole.y;
  let g=ctx.createRadialGradient(hx,hy,R*.6,hx,hy,R*1.5);g.addColorStop(0,'rgba(138,92,255,.55)');g.addColorStop(1,'rgba(138,92,255,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(hx,hy,R*1.5,0,7);ctx.fill();
  g=ctx.createRadialGradient(hx,hy,R*.2,hx,hy,R);g.addColorStop(0,'#000');g.addColorStop(.8,'#06020f');g.addColorStop(1,'#1a0838');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(hx,hy,R,0,7);ctx.fill();ctx.lineCap='round';
  for(let k=0;k<3;k++){const a0=TT*(2-k*.6)+k*2;ctx.strokeStyle='rgba(190,160,255,'+(.5-k*.12)+')';ctx.lineWidth=Math.max(1.5,R*.045);ctx.beginPath();ctx.arc(hx,hy,R*(.88-k*.2),a0,a0+1.6);ctx.stroke()}
  ctx.strokeStyle='#b79bff';ctx.lineWidth=Math.max(2.5,R*.07);ctx.beginPath();ctx.arc(hx,hy,R,0,7);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=Math.max(1,R*.02);ctx.beginPath();ctx.arc(hx,hy,R*.96,3.6,4.9);ctx.stroke();
  for(const o of objs)if(o.f<0&&vis(o))drawObj(o,1);
  ctx.font='bold 18px sans-serif';ctx.textAlign='center';
  for(const f of fx){ctx.globalAlpha=1-f.t/.8;ctx.fillStyle='#fff';ctx.strokeStyle='#000';ctx.lineWidth=3;
    ctx.strokeText(f.s,f.x,f.y-20-f.t*40);ctx.fillText(f.s,f.x,f.y-20-f.t*40)}
  ctx.globalAlpha=1;
  if(js){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(js.sx,js.sy,40,0,7);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.5)';ctx.beginPath();ctx.arc(js.sx+Math.max(-40,Math.min(40,js.x-js.sx)),js.sy+Math.max(-40,Math.min(40,js.y-js.sy)),16,0,7);ctx.fill()}
}
function loop(t){if(!running)return;const dt=Math.min((t-last)/1000,.05);last=t;TT=t/1000;update(dt);draw();requestAnimationFrame(loop)}
buildMap();
</script>
